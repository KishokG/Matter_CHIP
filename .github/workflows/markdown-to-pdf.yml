name: Convert Guide to PDF

# Runs automatically whenever the guide changes, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main]
    paths:
      - "UserGuides/Thread_meshcop_full_setup_guide.md"
      - "UserGuides/guide-style.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pandoc and weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Convert Markdown to HTML
        run: |
          cd UserGuides
          pandoc Thread_meshcop_full_setup_guide.md \
            -f gfm -t html5 --standalone \
            --css=guide-style.css \
            --metadata title="Thread MeshCoP Commissioning Guide" \
            -o guide.html

      - name: Convert HTML to PDF
        run: |
          mkdir -p UserGuides/pdf
          weasyprint UserGuides/guide.html UserGuides/pdf/Thread_meshcop_full_setup_guide.pdf

      - name: DEBUG - inspect generated PDF
        run: |
          echo "Contents of UserGuides/pdf/ after conversion:"
          ls -la UserGuides/pdf/
          echo ""
          echo "SHA256 of generated PDF:"
          sha256sum UserGuides/pdf/*.pdf
          echo ""
          echo "Git status before commit step:"
          git status

      # Explicit git commands — full visibility into exactly what happens.
      - name: Commit PDF back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Explicitly adding the PDF path:"
          git add -v UserGuides/pdf/Thread_meshcop_full_setup_guide.pdf

          echo ""
          echo "Git status after add:"
          git status

          if git diff --cached --quiet; then
            echo "No staged changes — nothing to commit."
          else
            git commit -m "docs: auto-update guide PDF"
            git push
            echo "Committed and pushed."
          fi

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thread-meshcop-setup-guide-pdf
          path: UserGuides/pdf/*.pdf
