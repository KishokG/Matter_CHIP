name: Convert Guide to PDF

# Runs automatically whenever the guide changes, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main]
    paths:
      - "UserGuides/Thread_meshcop_full_setup_guide.md"
      - "UserGuides/guide-style.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: DEBUG - confirm theme file exists before conversion
        run: |
          echo "Contents of UserGuides/:"
          ls -la UserGuides/
          echo ""
          echo "guide-style.css contents (first 5 lines):"
          head -5 UserGuides/guide-style.css || echo "!!! guide-style.css NOT FOUND !!!"

      - name: Convert Markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: UserGuides
          output_dir: UserGuides/pdf
          images_dir: images
          image_import: /
          build_html: false
          theme: UserGuides/guide-style.css
          extend_default_theme: true
          table_of_contents: false

      - name: DEBUG - inspect generated PDF
        run: |
          echo "Contents of UserGuides/pdf/ after conversion:"
          ls -la UserGuides/pdf/
          echo ""
          echo "SHA256 of generated PDF:"
          sha256sum UserGuides/pdf/*.pdf
          echo ""
          echo "Git status before commit step:"
          git status
          git diff --stat

      # Explicit git commands instead of a third-party commit action —
      # gives us full visibility into exactly what's happening.
      - name: Commit PDF back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Files currently at UserGuides/pdf/:"
          find UserGuides/pdf -type f

          echo ""
          echo "Explicitly adding the PDF path:"
          git add -v UserGuides/pdf/Thread_meshcop_full_setup_guide.pdf

          echo ""
          echo "Git status after add:"
          git status

          if git diff --cached --quiet; then
            echo "No staged changes — nothing to commit."
          else
            git commit -m "docs: auto-update guide PDF"
            git push
            echo "Committed and pushed."
          fi

      # Option B — also attach it as a workflow artifact (downloadable
      # from the Actions run page, no repo commit needed). Keep both,
      # or delete whichever option you don't want.
      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thread-meshcop-setup-guide-pdf
          path: UserGuides/pdf/*.pdf
